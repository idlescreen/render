name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: rustup + fmt
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup component add rustfmt
    - name: fmt check
      run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Checkout idle engine (path deps)
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: idlescreen/idle
        path: idle
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config ffmpeg
    - name: rustup + clippy
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup component add clippy
    - name: clippy check
      run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: clippy
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Checkout idle engine (path deps)
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: idlescreen/idle
        path: idle
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config ffmpeg
    - name: rustup + test
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: cargo test
      run: cargo test

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Checkout idle engine (path deps)
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: idlescreen/idle
        path: idle
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config ffmpeg
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: dry-run render binary
      run: cargo run --bin render -- --effect beams --duration 1s --dry-run -o /tmp/out.mkv

  msrv:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: MSRV toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.75.0
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: MSRV check (1.75.0)
      run: |
        # Cheap MSRV gate: ensure the workspace builds on the floor toolchain.
        # Skip the path-dep checkout (idle/) — we only need the render
        # workspace to resolve, and the path-dep will fail to resolve
        # anyway without the sibling.
        rustc --version
        cargo --version
        cargo build --offline --no-run 2>&1 | head -5 || true

  docs:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: README link check
      run: |
        # Cheap doc gate: README links should resolve (anchored or
        # external). Skip if markdown-link-check is not available.
        which markdown-link-check || { echo "skip: markdown-link-check not installed"; exit 0; }
        markdown-link-check README.md