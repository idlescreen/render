name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: rustup + fmt
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup component add rustfmt
    - name: file length cap (256 lines)
      run: |
        over=$(find . -name '*.rs' -not -path './target/*' -not -path './runtime/*' | xargs wc -l | awk '$1 > 256 && $2 != "total" {print}')
        [ -z "$over" ] || { echo "Files over 256 lines:"; echo "$over"; exit 1; }
    - name: fmt check
      run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Checkout runtime engine (path deps)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: idlescreen/runtime
        path: runtime
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config ffmpeg
    - name: rustup + clippy
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup component add clippy
    - name: clippy check
      run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: clippy
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Checkout runtime engine (path deps)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: idlescreen/runtime
        path: runtime
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config ffmpeg
    - name: rustup + test
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: cargo test
      run: cargo test

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Checkout runtime engine (path deps)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: idlescreen/runtime
        path: runtime
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config ffmpeg
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: dry-run render binary
      run: cargo run --bin render -- --effect beams --duration 1s --dry-run -o /tmp/out.mkv

  msrv:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Checkout runtime engine (path deps)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: idlescreen/runtime
        path: runtime
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config
    - name: MSRV toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: MSRV build (1.96.0)
      # Real gate: the workspace must build on the pinned floor toolchain.
      # (1.75 is impossible — idle-api is edition-2024; the previous job
      # self-skipped with `|| true` and gated nothing.)
      run: cargo build --workspace --all-targets

  docs:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: README link check
      run: |
        npm install -g markdown-link-check@3 >/dev/null
        markdown-link-check README.md