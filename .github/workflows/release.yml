name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must exist)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Checkout idle engine (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config \
            libwayland-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype6-dev \
            libssl-dev ffmpeg

      - name: Install Rust (from rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustc --version

      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo binstall -y cargo-deb cargo-generate-rpm

      - name: Build release binaries
        run: cargo build --release -p render -p idle-studio

      - name: Determine which packages to publish
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The packages pool is the source of truth for "already
          # distributed". Rebuilding an unchanged version produces
          # byte-different files that trip the importer's no-clobber
          # guard — skip anything whose exact filenames already exist.
          in_pool() {
            gh api "repos/idlescreen/packages/contents/rpm/pool/$1" \
              --jq .name >/dev/null 2>&1 || \
            gh api "repos/idlescreen/packages/contents/apt/pool/main/$2" \
              --jq .name >/dev/null 2>&1
          }
          ver() { grep -m1 '^version' "$1/Cargo.toml" | cut -d'"' -f2; }
          engine_v=$(ver engine)
          studio_v=$(ver studio)
          if in_pool "render-${engine_v}-1.x86_64.rpm" "render_${engine_v}-1_amd64.deb"; then
            echo "engine=skip" >> "$GITHUB_OUTPUT"
          else
            echo "engine=build" >> "$GITHUB_OUTPUT"
          fi
          if in_pool "idle-studio-${studio_v}-1.x86_64.rpm" "idle-studio_${studio_v}-1_amd64.deb"; then
            echo "studio=skip" >> "$GITHUB_OUTPUT"
          else
            echo "studio=build" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Package crates
        run: |
          if [ "${{ steps.plan.outputs.engine }}" = "build" ]; then
            (cd engine && cargo deb --no-build)
            (cd engine && cargo generate-rpm)
          fi
          if [ "${{ steps.plan.outputs.studio }}" = "build" ]; then
            (cd studio && cargo deb --no-build)
            (cd studio && cargo generate-rpm)
          fi

      - name: Install Cosign
        run: |
          curl -Lo cosign https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/

      - name: Sign packages with Cosign
        run: |
          # cargo-deb writes to the workspace target/; generate-rpm writes
          # to the member's own engine/target/.
          shopt -s nullglob
          for file in target/debian/*.deb \
                      target/generate-rpm/*.rpm \
                      engine/target/generate-rpm/*.rpm \
                      studio/target/generate-rpm/*.rpm; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
          done

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release create "${{ inputs.tag || github.ref_name }}" \
            --title "${{ inputs.tag || github.ref_name }}" \
            --notes "Release ${{ inputs.tag || github.ref_name }}" \
            target/debian/*.deb \
            target/debian/*.sig \
            target/debian/*.pem \
            target/generate-rpm/*.rpm \
            target/generate-rpm/*.sig \
            target/generate-rpm/*.pem \
            engine/target/generate-rpm/*.rpm \
            engine/target/generate-rpm/*.sig \
            engine/target/generate-rpm/*.pem \
            studio/target/generate-rpm/*.rpm \
            studio/target/generate-rpm/*.sig \
            studio/target/generate-rpm/*.pem

      - name: Trigger Packages Repository Update
        env:
          DISPATCH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set — packages repo will not update"
            exit 1
          fi
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/idlescreen/packages/dispatches \
            -d "{\"event_type\": \"new_release\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"tag\": \"${{ inputs.tag || github.ref_name }}\"}}"
