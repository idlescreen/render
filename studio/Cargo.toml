[package]
name = "idle-studio"
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"
description = "IdleScreen Studio — UI that drives the render capability"
repository = "https://github.com/idlescreen/render"
readme = "README.md"
default-run = "idle-studio"

[lib]
name = "idle_studio"
path = "src/lib.rs"

[[bin]]
name = "idle-studio"
path = "src/main.rs"

[[bin]]
name = "app-studio"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossterm = "0.29"
ratatui = "0.30"
# Shared job contract with the render capability (same repo)
idle_render = { path = "../engine", package = "render" }

[dev-dependencies]
proptest = "1"

[package.metadata.deb]
name = "idle-studio"
copyright = "2026 IdleScreen"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
extended-description = "IdleScreen Studio UI — queues jobs for the render capability."
section = "utils"
priority = "optional"
assets = [
    ["target/release/idle-studio", "usr/bin/idle-studio", "755"],
    ["assets/io.github.idlescreen.studio.desktop", "usr/share/applications/io.github.idlescreen.studio.desktop", "644"]
]

[package.metadata.generate-rpm]
name = "idle-studio"
release = "1"
arch = "x86_64"
summary = "IdleScreen Studio UI"
description = "IdleScreen Studio UI — drives render offline export jobs."
license = "Apache-2.0"
assets = [
    { source = "target/release/idle-studio", dest = "/usr/bin/idle-studio", mode = "755" },
    { source = "assets/io.github.idlescreen.studio.desktop", dest = "/usr/share/applications/io.github.idlescreen.studio.desktop", mode = "644" }
]
