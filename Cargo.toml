[workspace]
members = ["engine", "studio"]
resolver = "2"

# Default binary for `cargo run` convenience
default-members = ["engine"]

[workspace.dependencies]
# Pure-Rust PNG encoder for sprite-style snapshots (added in Sprint 02).
png = "0.17"

[workspace.package]
authors = ["idlescreen developers"]
repository = "https://github.com/idlescreen/idlescreen"
