[workspace]
members = ["engine"]
# `idle/` is the sibling engine checkout (CI) or a symlink to it (local):
# without exclude, path deps under it bind to THIS workspace root and their
# `dep.workspace = true` fields resolve against render's dependencies.
exclude = ["idle"]
resolver = "2"

# Default binary for `cargo run` convenience
default-members = ["engine"]

[workspace.dependencies]
# Pure-Rust PNG encoder for sprite-style snapshots (added in Sprint 02).
png = "0.17"

[workspace.package]
authors = ["idlescreen developers"]
repository = "https://github.com/idlescreen/render"
