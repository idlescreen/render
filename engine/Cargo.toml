[package]
name = "render"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
description = "IdleScreen offline export capability — simulation to AV1 video"
repository = "https://github.com/idlescreen/render"
readme = "../README.md"
keywords = ["idlescreen", "screensaver", "av1", "render"]
categories = ["command-line-utilities", "multimedia"]
# Prefer the product name when multiple bins share main.rs.
default-run = "render"

[lib]
name = "idle_render"
path = "src/lib.rs"

[[bin]]
name = "render"
path = "src/main.rs"

[[bin]]
name = "idle-render"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Path goes outside this workspace so idle's own workspace root applies.
idle-runner = { path = "../../idle/idle-runner" }
idle-api = { path = "../../idle/idle-api" }

[dev-dependencies]
proptest = "1"

[package.metadata.deb]
name = "render"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
copyright = "2026 IdleScreen"
extended-description = "Offline IdleScreen effect renderer (ffmpeg AV1)."
depends = "libc6, ffmpeg"
section = "utils"
priority = "optional"
assets = [
    ["target/release/render", "usr/bin/render", "755"],
    ["target/release/idle-render", "usr/bin/idle-render", "755"]
]
